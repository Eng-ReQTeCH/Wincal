name: Build Windows installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test
        shell: cmd
        run: build.cmd ${{ matrix.arch }}
      - name: Test startup registration and uninstall
        if: matrix.arch == 'x64'
        shell: cmd
        run: build\x64\installer_test.exe --registry
      - name: Test a plain HTTP CalDAV connection
        if: matrix.arch == 'x64'
        shell: cmd
        run: build\x64\installer_test.exe --http
      - uses: actions/upload-artifact@v7
        with:
          name: wincal-${{ matrix.arch }}
          path: build/wincal-setup-${{ matrix.arch }}.exe
          if-no-files-found: error
