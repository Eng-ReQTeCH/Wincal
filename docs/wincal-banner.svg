<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="384" viewBox="0 0 1120 384" role="img" aria-labelledby="title description">
  <title id="title">wincal for Windows 11</title>
  <desc id="description">CalDAV events in the Windows taskbar calendar, illustrated with date dots and a sample agenda.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101b35"/>
      <stop offset="1" stop-color="#23366b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6689f1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6689f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calendar" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eaf0fc"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1120" height="384" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1120" height="384" fill="url(#background)"/>
    <ellipse cx="900" cy="194" rx="360" ry="276" fill="url(#glow)"/>
    <g fill="none" stroke="#b3c5ff" opacity=".15">
      <circle cx="1000" cy="193" r="226"/>
      <circle cx="1000" cy="193" r="257"/>
      <circle cx="1000" cy="193" r="287"/>
    </g>
